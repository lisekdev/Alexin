name: Build Alexin IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned
        run: |
          xcodebuild -project Alexin.xcodeproj -scheme Alexin -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Alexin.app Payload/
          zip -qr Alexin.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Alexin-ipa
          path: Alexin.ipa
